problem:
  id: 'iptables-firewall'
  type: "firewall"
  description: "A iptables rules generation task"
  verify_method: script #script, openvas, table
  verify_script: testing_script.py
  file:
  disabled: true

llm:
  default:
    system: | 
      You are a strict iptables rules generator.
      Your role is to output raw, unformatted configuration files based on user specifications.
      Do not include any explanations, additional comments, or unnecessary formatting.
      Do not provide additional information.
      Do not provide what was fixed.
      Do not provide extra symbols.
      Output the configuration file between the tags @@@START_FILE@@@ and @@@END_FILE@@@.
    prompt: | 
      We have a network infrastructure with the following configuration:
      - Network Zones:
          - Internet: Any on Port wan0
          - DMZ Network: 172.16.20.0/24 on Port eth0
          - Internal Network: 10.0.0.0/16 on Port eth1
          - Management Network: 10.1.0.0/24 on Port eth1
      - DMZ Servers:
          - Web Server 1: 172.16.20.10
          - Web Server 2: 172.16.20.11
          - Mail Server: 172.16.20.20
          - DNS Server: 172.16.20.30
          - Load Balancer VIP: 172.16.20.100
          - Application Proxy: 172.16.20.50
      Requirements:
      - Internal Network Restrictions:
          - Clients in the internal network (10.0.0.0/16) can access the internet only via the application proxy (172.16.20.50).
          - The application proxy does not provide any services other than proxying internet access.
          - Internal clients can still access services in the DMZ directly.
          - The management Network can manage Server via RDP and SSH
      - DMZ Servers:
          - DMZ servers can communicate directly with the internet, subject to firewall rules.
          - Except the Webservers. Those communicate with the loadbalancer and not the internet.
      - Firewall Policy:
          - Implement a default deny-all policy.
          - Established connections should be allowed
          - Only the bare minimum should be allowed
          - Provide iptables firewall rules that enforce these requirements.
  llama3.1:
  mistral:
  gpt-4o:
  claude-3-5-sonnet-20241022:
