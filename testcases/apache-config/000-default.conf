<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Bad practice: Allow directory listing
    # Allow directory listing and overrides
    <Directory "/var/www/html">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Enable insecure HTTP methods (within Directory block)
        <LimitExcept GET POST>
            Require all granted
        </LimitExcept>
    </Directory>

    # Enable mod_headers for using Header directive
    # You need to ensure mod_headers is enabled
    # Run: a2enmod headers
    <IfModule mod_headers.c>
        # Bad practice: Disable security headers
        Header unset X-Content-Type-Options
        Header unset X-Frame-Options
        Header unset X-XSS-Protection
    </IfModule>

    # Bad practice: Allow unrestricted access to sensitive files
    <FilesMatch "\.(htaccess|htpasswd|conf|ini|log|sh|sql|bak)$">
        Require all granted
    </FilesMatch>

    # If you are not using SSL, these settings should be omitted or corrected
    SSLProtocol All -SSLv3 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder On
</VirtualHost>
