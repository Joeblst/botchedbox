# https://downloads.cisecurity.org/#/
# CIS Apache HTTP Server 2.4 Benchmark v2.1.0

ServerRoot "/usr/local/apache2"

# CIS-Benchmark p. 57
# PidFile should not be in DocumentRoot
PidFile "/var/www/httpd.pid"

Listen 80

# CIS Benchmark p. 20
# Unnecessary Authentication and Authorization Modules (only ldap_module authnz_ldap_module)
# CIS Benchmark p. 26-28
# Status and Autoindex modules should be disabled
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authnz_ldap_module modules/mod_authnz_ldap.so
LoadModule ldap_module modules/mod_ldap.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule filter_module modules/mod_filter.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so

# CIS-Benchmark p. 40-42
# User and Group should not be root
<IfModule unixd_module>
    User root
    Group root
</IfModule>

ServerAdmin you@example.com

DocumentRoot "/var/www/"

# CIS-Benchmark p. 69-70
# Missing "default deny" rule

# CIS-Benchmark p. 72-73, 75-77, 80-84, 94-97
# Appropriate access rights, AllowOverride should be set to None for all, Options should be restricted (not includes)
# HTTP Methods should be restricted
# Website1 missing Require directive, Options Includes should be disabled, Options Method should be disabled
# Website2 AllowOverride, Options and Trace should be disabled
# /restricted missing Require directive
# /server-status should be disabled
<Directory "/var/www/website1">
    Options Includes
    <LimitExcept GET POST OPTIONS>
        Require all denied
    </LimitExcept>
</Directory>
<Directory "/var/www/website2">
    AllowOverride All
    Require all granted
    <LimitExcept GET POST OPTIONS TRACE>
        Require all denied
    </LimitExcept>
</Directory>
<Location /restricted>
</Location>
<Location /portal>
    Require valid-user
</Location>
# <Location /server-info>
#    SetHandler server-info
#     Order deny,allow
#     Deny from all
#     Allow from .example.com
# </Location>
<Location /server-status>
   SetHandler server-status
    Order deny,allow
    Deny from all
    Allow from .example.com
</Location>


<IfModule dir_module>
    DirectoryIndex index.html
</IfModule>

<Files ".ht*">
    Require all denied
</Files>

ErrorLog /proc/self/fd/2

LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common

    <IfModule logio_module>
      LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
    </IfModule>
    CustomLog /proc/self/fd/1 common
</IfModule>

<IfModule alias_module>
    ScriptAlias /cgi-bin/ "/usr/local/apache2/cgi-bin/"
</IfModule>

<Directory "/usr/local/apache2/cgi-bin">
    AllowOverride None
    Require all granted
</Directory>

# CIS-Benchmark p. 113-118
# Appropriate Headers should be set
<IfModule headers_module>
    RequestHeader unset Proxy early
    Header always set X-XSS-Protection "1; mode=block"
</IfModule>

<IfModule mime_module>
    TypesConfig conf/mime.types
    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
</IfModule>

# CIS-Benchmark p. 152, 154, 169
# Secure TLS should be used
# Weak ciphers should be disabled, SSLHonorCipherOrder should be enabled
<IfModule ssl_module>
    Listen 443
    <VirtualHost *:443>
        ServerName example.com
        DocumentRoot "/var/www"
        SSLEngine on
        SSLCertificateFile /path/to/cert.pem
        SSLCertificateKeyFile /path/to/key.pem
        SSLProtocol All -TLSv1
    </VirtualHost>
</IfModule>
