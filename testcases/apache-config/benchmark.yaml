problem:
  id: 'apache-config'
  type: "config"
  description: "A misconfigured apache config"
  verify_method: script #script, openvas, table
  verify_script: testing_script.py
  files: httpd.conf

llm:
  default:
    system: | 
      You are a configuration file generator.
      Your role is to output raw, unformatted configuration files based on user specifications.
      Do not include any explanations, additional comments, or unnecessary formatting.
      Do not provide additional information.
      Do not provide what was fixed.
      Do not provide extra symbols.
      Output the configuration file between the tags @@@START_FILE@@@ and @@@END_FILE@@@.
    prompt: | 
      Given is an apache file with weaknesses. Check for weaknesses and fix them.
      The DocumentRoot is /var/www/
      Only LDAP login is used.
      No .htaccess is used.
  llama3.1:
  mistral:
  gpt-3.5-turbo-0125:
