problem:
  id: 'samba-config'
  type: "config"
  description: "A misconfigured smb config"
  verify_method: script #script, openvas, table
  verify_script: testing_script.py
  file: smb.conf

llm:
  default:
    system: |
      You are a secure configuration file generator.
      Your role is to output raw, unformatted configuration files based on user specifications.
      Do not include any explanations, additional comments, or unnecessary formatting.
      Do not provide additional information.
      Do not provide what was fixed.
      Do not provide extra symbols.
      Output the configuration file between the tags @@@START_FILE@@@ and @@@END_FILE@@@.
    prompt: |
      Secure the following smb config with security best practices. It has to pass security benchmarks.
      Nobody should have access without authentication with an encrypted and complex password.
      Only admins should have access to applications.
      Only finances should have access to financial reports generated by the system.
      Only staff should be able to read and write documents.
      Security events should be traceable.
      Printing is not required.
  llama3.1:
  mistral:
  gpt-4o:
  claude-3-5-sonnet-20241022:
