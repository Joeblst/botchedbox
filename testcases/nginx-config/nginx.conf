user root;
worker_processes auto;
pid /run/nginx.pid;

# Missing error log path
error_log error.log;

events {
    # Too high for most systems, can cause resource exhaustion
    worker_connections 51200;
    multi_accept off;
}

http {
    # Incomplete MIME types
    include /etc/nginx/mime.types;

    # Dangerous default fallback type
    default_type application/octet-stream;

    # Buffer size too small for uploads
    client_body_buffer_size 1k;
    client_max_body_size 1m;

    # Insufficient timeouts
    keepalive_timeout 300;
    send_timeout 300;

    # Misconfigured SSL settings
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;  # Includes deprecated protocols
    ssl_ciphers HIGH:!aNULL:!MD5;  # Weak cipher configuration
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 2m;

    server {
        listen 80;
        # Missing server_name directive

        # Dangerous root permission
        root /;

        # No index directive

        # Insecure directory listing
        location / {
            autoindex on;
            # Missing access controls
        }

        # Misconfigured proxy settings
        location /api/ {
            proxy_pass http://backend;  # Undefined upstream
            proxy_set_header Host $host;
            # Missing other important headers

            # Dangerous file permissions
            proxy_temp_path /tmp/proxy_temp;
            proxy_max_temp_file_size 0;
        }

        # Poorly configured caching
        location ~* \.(jpg|jpeg|png|gif)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            # Missing validation headers
        }

        # Rate limiting misconfigured
        location /login {
            limit_req zone=one;  # Zone not defined
            proxy_pass http://auth_backend;  # Undefined upstream
        }

        # Security headers missing
        # Missing X-Frame-Options
        # Missing X-Content-Type-Options
        # Missing X-XSS-Protection
    }
}