services:
  botchedbox:
    build: .
    volumes:
      - gvmd_socket_vol:/run/gvmd
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    networks:
      - external-network
      - vulnerable-network
      - control-pane-network
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_vol:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - external-network

volumes:
  gvmd_socket_vol:
    external: true
  ollama_vol:

networks:
  external-network:
    external: true
  vulnerable-network:
    external: true
  control-pane-network:
    external: true