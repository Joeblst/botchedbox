problem:
  type: "cve"  # Mögliche Typen: cve, config, phishing, firewall
  openvas_required: true  # Gibt an, ob OpenVAS für dieses Problem verwendet werden soll
  description: "Log4Shell - eine Remote Code Execution Schwachstelle in Log4j."  # Beschreibung des Problems
  benchmark_file: "path/to/benchmark.sh"  # Optional für Config-, Phishing- oder Firewall-Probleme, für CVEs nicht benötigt

llm:
  system:
    prompt:
      gpt: "Überprüfe das System auf Sicherheitslücken und behebe sie."  # Prompt, der an GPT im Systemkontext gesendet wird
      andere: "Systemdiagnose auf Sicherheitslücken."  # Platzhalter für weitere Systeme oder Rollen
  prompt:
    gpt: "Behebe das Problem und stelle sicher, dass die Firewall korrekt konfiguriert ist."  # Prompt, der an GPT gesendet wird
    andere: "Überprüfe die Systemkonfiguration und behebe bekannte Probleme."  # Platzhalter für andere Prompts

metadata:
  image_name: "vulnerable-app"
  version: "1.0"
  environment: "Docker"
  additional_info: "Dieses Image enthält eine Log4Shell Schwachstelle (CVE-2021-44228)."
