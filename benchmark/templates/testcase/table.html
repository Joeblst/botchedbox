<div class="table-responsive">
    <table class="table table-striped table-sm">
        <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Type</th>
            <th scope="col">Description</th>
        </tr>
        </thead>
        <tbody>
        {% for testcase in testcase_infos %}
            <tr>
                <td>{{ testcase.id }}</td>
                <td>{{ testcase.type }}</td>
                <td>{{ testcase.description }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
