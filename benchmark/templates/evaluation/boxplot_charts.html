{% extends 'pagelayout.html' %}
{% load static %}

{% block head %}
    <title>Botchedbox | Evaluation</title>
{% endblock %}

{% block content %}
    <div class="overview-container">
        <!-- Filters -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Filters</h5>
                    <div class="d-flex gap-3 align-items-center">
                        <div class="d-flex align-items-center">
                            <label for="temperature" class="me-2">Temperature:</label>
                            <input type="number" id="temperature" class="form-control"
                                   min="0" max="100" value="0" style="width: 80px;">
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-secondary btn-sm" onclick="toggleAllFilters(true)">Select All</button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="toggleAllFilters(false)">Clear All</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h6 class="text-muted mb-3">Problem Types</h6>
                        <div id="problem-type-filters"></div>
                    </div>
                    <div class="col-md-6">
                        <h6 class="text-muted mb-3">Models</h6>
                        <div id="model-filters"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div id="charts-container"></div>
    </div>
{% endblock %}

{% block scripts %}
    <script src="{% static 'js/ext/chart.umd.js' %}"></script>
    <script src="{% static 'js/ext/chartjs-chart-boxplot.js' %}"></script>
    <script src="{% static 'js/ext/html2canvas.min.js' %}"></script>
    <script src="{% static 'js/charts.js' %}"></script>
{% endblock %}
