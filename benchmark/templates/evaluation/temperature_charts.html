{% extends 'pagelayout.html' %}
{% load static %}

{% block head %}
    <title>Temperature Comparison</title>
{% endblock %}

{% block content %}
    <div class="overview-container">
        <!-- Filters -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Filters</h5>
                    <div class="d-flex gap-2">
                        <div class="d-flex align-items-center">
                            <label for="testcase-select" class="me-2">Testcase:</label>
                            <select id="testcase-select" class="form-select" style="width: 200px;">
                                <!-- Will be populated dynamically -->
                            </select>
                        </div>
                        <button class="btn btn-outline-secondary btn-sm" onclick="downloadAllCharts()">Download All</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Container -->
        <div id="charts-container"></div>
    </div>
{% endblock %}

{% block scripts %}
    <script src="{% static 'js/ext/chart.umd.js' %}"></script>
    <script src="{% static 'js/ext/chartjs-chart-boxplot.js' %}"></script>
    <script src="{% static 'js/ext/html2canvas.min.js' %}"></script>
    <script src="{% static 'js/temperature_charts.js' %}"></script>
{% endblock %}
