{% load bootstrap_icons %}
<div class="sidebar-content d-flex flex-column flex-shrink-0 text-white h-100">
    <!-- Brand -->
    <div class="brand-container text-center py-4">
        <a href="/" class="brand-link d-inline-flex align-items-center text-white text-decoration-none">
            {% bs_icon 'box' size='1.75em' extra_classes='text-info me-2' %}
            <span class="brand-title fs-4">Botchedbox</span>
        </a>
    </div>

    <hr>

    <!-- Navigation -->
    <ul class="nav nav-pills flex-column flex-grow-1">
        <li class="nav-item">
            <a href="/" class="nav-link text-white {% if request.path == '/' %}active{% endif %}">
                {% bs_icon 'clipboard-data' size='1.1em' extra_classes='me-2' %}
                Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a href="/testcases/" class="nav-link text-white {% if '/testcases/' in request.path %}active{% endif %}">
                {% bs_icon 'bag-check' size='1.1em' extra_classes='me-2' %}
                Testcases
            </a>
        </li>
    </ul>
</div>
