<div class="table-responsive">
    <table class="table table-striped table-sm">
        <thead>
        <tr>
            <th scope="col">Benchmark-ID</th>
            <th scope="col">State</th>
            <th scope="col">Timestamp</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        {% for benchmark in benchmarks %}
            {% if benchmark.benchmark_id %}
                <tr onclick="window.location.href='{% url 'get_benchmark' benchmark.benchmark_id %}'" style="cursor: pointer;">
                    <td>{{ benchmark.benchmark_id }}</td>
                    <td>{{ benchmark.state }}</td>
                    <td>{{ benchmark.timestamp }}</td>
                    <td>
                        <form action="{% url 'index' benchmark.benchmark_id %}" method="post" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </td>

                </tr>
            {% else %}
                <tr>
                    <td colspan="6">No Benchmark ID available</td>
                </tr>
            {% endif %}
        {% endfor %}
        </tbody>
    </table>
</div>
