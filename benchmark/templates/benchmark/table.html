<div class="table-responsive">
    <table class="table table-striped table-sm">
        <thead>
        <tr>
            <th scope="col">Benchmark-ID</th>
            <th scope="col">Testcase-ID</th>
            <th scope="col">Model</th>
            <th scope="col">Score</th>
            <th scope="col">State</th>
            <th scope="col">Timestamp</th>
        </tr>
        </thead>
        <tbody>
        {% for test in tests %}
            {% if test.benchmark_id %}
                <tr onclick="window.location.href='{% url 'benchmark' test.benchmark_id %}'" style="cursor: pointer;">
                    <td>{{ test.benchmark_id }}</td>
                    <td>{{ test.testcase_id }}</td>
                    <td>{{ test.model }}</td>
                    <td>{{ test.score }}</td>
                    <td>{{ test.state }}</td>
                    <td>{{ test.timestamp }}</td>
                </tr>
            {% else %}
                <tr>
                    <td colspan="6">No Benchmark ID available</td>
                </tr>
            {% endif %}
        {% endfor %}
        </tbody>
    </table>
</div>
