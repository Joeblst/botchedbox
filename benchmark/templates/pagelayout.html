<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botchedbox</title>
    {% load bootstrap5 %}
    {% load static %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    {% load static %}
    {% load sass_tags %}
    <link rel="stylesheet" href="{% sass_src 'scss/import.scss' %}">
</head>
<body>
<div class="layout-wrapper">
    <div class="main-container">
        <div id="sidebar" class="shadow col-auto col-md-3 col-xl-2 px-sm-2 px-0 bg-dark">
            {% include 'sidebar/default.html' %}
        </div>
        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</div>
{% include 'footer/default.html' %}
{% block scripts %}
{% endblock %}
</body>
</html>
